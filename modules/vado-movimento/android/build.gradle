plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.vado'
version = '0.1.0'

android {
  namespace "app.vado.movimento"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // La stessa versione usata da expo-location.
  implementation 'com.google.android.gms:play-services-location:21.0.1'
  implementation 'androidx.core:core:1.13.1'
}
