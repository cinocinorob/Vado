# Scarica i dati aperti del trasporto pubblico di Roma e ne estrae la rete
# della metropolitana (stazioni, linee, distanze lungo il tracciato).
#
# Il risultato finisce nel ramo "dati-rete" del repository: da lì, dopo un
# controllo a occhio del rapporto, metro.json viene copiato in
# src/data/metro-roma.json. Non modifica mai il ramo principale da solo.
#
# Si lancia a mano dalla scheda Actions ("Run workflow"), quando ATAC cambia
# la rete (una stazione nuova, un prolungamento). Parte anche da sola a ogni
# invio sul ramo "rete", usato per mettere a punto lo script.

name: Aggiorna la rete della metro

on:
  workflow_dispatch:
  push:
    branches: [rete]

permissions:
  contents: write

jobs:
  rete:
    name: Rete della metro
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Scarica i dati di Roma Servizi per la Mobilità
        run: |
          curl -fL --retry 3 --max-time 600 -o gtfs.zip \
            "https://romamobilita.it/sites/default/files/rome_static_gtfs.zip"
          ls -la gtfs.zip

      - name: Estrae la rete
        run: |
          mkdir -p rete
          python3 scripts/rete_metro.py gtfs.zip rete

      - name: Estrae bus e tram
        run: python3 scripts/rete_bus.py gtfs.zip rete

      - name: Prova il flusso in tempo reale dei mezzi
        continue-on-error: true
        run: python3 scripts/prova_tempo_reale.py "https://romamobilita.it/sites/default/files/rome_rtgtfs_vehicle_positions_feed.pb" rete

      - name: Conserva il risultato nel ramo dati-rete
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d rete ] || mkdir rete
          cd rete
          date -u +"%Y-%m-%dT%H:%MZ" > scaricato-il.txt
          git init -q -b dati-rete
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Rete della metro estratta dall'esecuzione n. ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" dati-rete
