# Costruisce l'app Android a ogni modifica, la prova su un telefono simulato e,
# solo se la prova riesce, la pubblica come file scaricabile.
#
# Risultato: una pagina "Releases" del repository con il file vado.apk, da
# aprire e installare direttamente dal telefono. Non serve un PC.
#
# Si avvia da solo a ogni invio di codice sul ramo principale; si può anche
# lanciare a mano dalla scheda Actions del repository ("Run workflow").

name: Costruisci l'app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  costruzione:
    name: Costruzione
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v7

      # Se il codice dell'app non è cambiato (per esempio è cambiata solo la
      # prova) si riusa il file già costruito, risparmiando una ventina di minuti.
      - name: File già costruito per questo codice?
        id: pronto
        uses: actions/cache@v5
        with:
          path: |
            vado.apk
            vado-x86.apk
          key: apk-v2-${{ hashFiles('src/**', 'assets/**', 'plugins/**', 'modules/**', 'app.json', 'package.json', 'package-lock.json', 'tsconfig.json', 'eslint.config.js') }}

      - uses: actions/setup-node@v7
        if: steps.pronto.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        if: steps.pronto.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Installa le dipendenze
        if: steps.pronto.outputs.cache-hit != 'true'
        run: npm ci

      - name: Controlli automatici (regole, filtro GPS, tipi)
        if: steps.pronto.outputs.cache-hit != 'true'
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Genera il progetto Android
        if: steps.pronto.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install

      # Ogni build ha un numero di versione più alto della precedente, così il
      # telefono la accetta come aggiornamento senza disinstallare.
      - name: Numero di versione
        if: steps.pronto.outputs.cache-hit != 'true'
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      # arm64 è l'architettura dei telefoni; x86_64 serve al telefono simulato
      # della prova. Un file per ciascuna (plugins/abi-split.js), dalla stessa
      # compilazione: stesso codice, ma quello per il telefono pesa molto meno.
      - name: Compila
        if: steps.pronto.outputs.cache-hit != 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Prepara il file
        if: steps.pronto.outputs.cache-hit != 'true'
        run: |
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk vado.apk
          cp android/app/build/outputs/apk/release/app-x86_64-release.apk vado-x86.apk
          ls -la vado.apk vado-x86.apk

      - uses: actions/upload-artifact@v7
        with:
          name: vado-apk
          path: |
            vado.apk
            vado-x86.apk

  prova:
    name: Prova su telefono simulato
    needs: costruzione
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: vado-apk

      # Senza accelerazione il telefono simulato è troppo lento per essere usabile.
      - name: Attiva l'accelerazione
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Android 16, la stessa versione richiesta dal Play Store e montata sui Pixel recenti.
      - name: Apre l'app, avvia un tragitto, cammina, termina
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/prova_emulatore.py vado-x86.apk prova-risultati salute

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prova-risultati
          path: prova-risultati
          if-no-files-found: ignore

      # Schermate e registro dell'ultima prova finiscono anche nel ramo
      # "diagnostica" del repository, sovrascritto ogni volta.
      - name: Conserva i risultati della prova
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d prova-risultati ] || exit 0
          cd prova-risultati
          git init -q -b diagnostica
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Risultati della prova n. ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" diagnostica

  pubblicazione:
    name: Pubblicazione
    needs: [costruzione, prova]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vado-apk

      - name: Pubblica come ultima versione
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima vado.apk \
            --target "${{ github.sha }}" \
            --title "Versione di prova n. ${{ github.run_number }}" \
            --notes "Scarica vado.apk dal telefono e aprilo per installare. Questa versione ha superato la prova automatica su un telefono simulato. Firmata con una chiave di prova: va bene per provare, non per il Play Store."
